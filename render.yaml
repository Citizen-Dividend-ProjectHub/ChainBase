services:
  - type: web
    name: chainbase
    env: python
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../server && pip install -r requirements.txt"
    startCommand: "cd server && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
